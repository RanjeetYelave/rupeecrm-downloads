name: Deploy RupeeCRM Download Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Run once daily at 06:00 UTC to automatically sync any new application releases
    - cron: '0 6 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Release Metadata from GitHub Releases API
        run: |
          python3 scripts/update-releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Release Artifacts & JSON Integrity
        run: |
          if [ ! -f data/releases.json ]; then
            echo "Error: data/releases.json was not generated."
            exit 1
          fi
          python3 -c "import json; data = json.load(open('data/releases.json')); assert data.get('latest_version'), 'Missing latest_version'; print('Validated metadata for version:', data['latest_version'])"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
